<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中文发音助手 — Китайский диктор</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#fff5f1;color:#29252a;margin:0;padding:25px}.wrap{max-width:850px;margin:auto;background:white;border:1px solid #f2d8ce;border-radius:22px;padding:25px;box-shadow:0 12px 35px #b8866c1c}h1{margin:0 0 8px}p{color:#71646b}textarea{width:100%;box-sizing:border-box;min-height:180px;border:1px solid #ddc9c3;border-radius:12px;padding:15px;font-size:22px;resize:vertical}label{display:block;margin:17px 0 6px;font-weight:600}select,input[type=number]{padding:10px;border:1px solid #ddc9c3;border-radius:10px;background:white;max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}button{border:0;border-radius:11px;background:#b75e48;color:white;padding:13px 20px;font-size:16px;cursor:pointer}button.secondary{background:#685b69}button:disabled{opacity:.5;cursor:not-allowed}#current{font-size:29px;min-height:40px;margin-top:20px}#status{font-size:14px;color:#766b70}.hint{font-size:13px}input[type=range]{width:100%}</style></head><body><main class="wrap"><h1>中文发音助手 🗣️</h1><p>Китайский диктор для уроков, повторения и диктантов</p><label for="words">Иероглифы и предложения (каждый элемент с новой строки)</label><textarea id="words">面包
鸡蛋
牛奶
咖啡
吃
喝
早上
包子
饺子
水
可乐
茶</textarea><div class="grid"><div><label for="voice">Китайский голос</label><select id="voice"></select></div><div><label for="speed">Скорость: <span id="speedVal">0.8×</span></label><input id="speed" type="range" min="0.5" max="1.5" step="0.05" value="0.8"></div><div><label for="repeat">Повторить каждое слово</label><select id="repeat"><option value="1">1 раз</option><option value="2" selected>2 раза</option><option value="3">3 раза</option></select></div><div><label for="pause">Пауза между словами (сек.)</label><input id="pause" type="number" min="0" max="30" step="1" value="5"></div></div><div class="buttons"><button id="play">▶ Начать</button><button id="stop" class="secondary">■ Остановить</button><button id="test" class="secondary">🔊 Проверить голос</button></div><div id="current"></div><div id="status" aria-live="polite">Готов к воспроизведению.</div><p class="hint">Для китайского системного произношения выберите голос с пометкой zh-CN. Если китайских голосов нет, установите китайский голос в системных настройках Mac. Во время диктанта держите эту вкладку открытой.</p></main><script>const synth=window.speechSynthesis;const $=id=>document.getElementById(id);let active=false,token=0,audio=null;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function voices(){let vs=synth.getVoices().filter(v=>/^zh/i.test(v.lang));$('voice').innerHTML='';if(!vs.length){let o=new Option('Китайский голос не найден — системный по умолчанию','');$('voice').add(o)}else vs.forEach(v=>{let o=new Option(v.name+' ('+v.lang+')',v.voiceURI);$('voice').add(o)});}voices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=voices;$('speed').oninput=()=>$('speedVal').textContent=Number($('speed').value).toFixed(2)+'×';async function azureSpeak(t,k){const res=await fetch("/api/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,voice:$("azureVoice").value,rate:Number($("speed").value)})});if(!res.ok){let err=await res.json().catch(()=>({error:"Ошибка сервера"}));throw Error(err.error||"Ошибка Azure");}if(!active||k!==token)return;const url=URL.createObjectURL(await res.blob());try{await new Promise((resolve,reject)=>{audio=new Audio(url);audio.onended=resolve;audio.onerror=()=>reject(Error("Не удалось воспроизвести аудио"));audio.play().catch(reject);});}finally{URL.revokeObjectURL(url);audio=null;}}function speak(t,k){return new Promise(resolve=>{if(!active||k!==token)return resolve();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=Number($('speed').value);let v=synth.getVoices().find(v=>v.voiceURI===$('voice').value);if(v)u.voice=v;u.onend=resolve;u.onerror=resolve;synth.speak(u);});}function stop(){active=false;token++;synth.cancel();if(audio){audio.pause();audio.src="";audio=null;}$('current').textContent='';$('status').textContent='Остановлено.';}$('stop').onclick=stop;$('test').onclick=async()=>{stop();active=true;let k=token;$('status').textContent='Проверка голоса…';try{await speak('你好！早上好！',k);}catch(e){$('status').textContent=e.message;active=false;return;}if(k===token){active=false;$('status').textContent='Проверка завершена.';}};$('play').onclick=async()=>{stop();let items=$('words').value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(!items.length){$('status').textContent='Введите хотя бы одно слово.';return;}active=true;let k=token;let n=Number($('repeat').value),pause=Number($('pause').value)*1000;for(let i=0;i<items.length&&active&&k===token;i++){for(let j=0;j<n&&active&&k===token;j++){$('current').textContent=items[i];$('status').textContent=`Слово ${i+1} из ${items.length}, повтор ${j+1} из ${n}`;try{await speak(items[i],k);}catch(e){$("status").textContent=e.message;active=false;return;}if(!active||k!==token)break;if(j<n-1)await wait(900,k);}if(i<items.length-1&&active&&k===token){$('status').textContent='Пауза для записи…';await wait(pause,k);}}if(active&&k===token){active=false;$('current').textContent='✓';$('status').textContent='Диктант завершён.';}};async function wait(ms,k){let end=Date.now()+ms;while(active&&k===token&&Date.now()<end)await sleep(Math.min(100,end-Date.now()));}</script></body></html>
